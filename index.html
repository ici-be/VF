<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <!-- liens courts …/VF/z/G8T9 et …/VF/u/Olivia : vers l'accueil, avec #z=G8T9 ou #u=Olivia (voir public/404.html ;
         ici pour l'appli installée, dont le service worker sert cette page à toutes les adresses) -->
    <script>(function () { var m = location.pathname.match(/^(.*?\/)(z|u)\/([^\/]+)\/?$/); if (m) location.replace(m[1] + '#' + m[2] + '=' + m[3]) })()</script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f5fbf" />
    <!-- toujours en clair : ni le mode sombre du système ni l'assombrissement forcé du navigateur -->
    <meta name="color-scheme" content="only light" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Woordjes</title>
    <!-- pas dans les moteurs de recherche : l'appli se partage par lien, pas par recherche -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="description" content="Réviser le vocabulaire néerlandais et les cours d’immersion : QCM, dictée, questions de cours, interros…" />
    <!-- la carte affichée quand on partage le lien (WhatsApp, Messenger, mail…) : adresse absolue obligatoire -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Woordjes" />
    <meta property="og:title" content="Woordjes" />
    <meta property="og:description" content="Réviser le vocabulaire néerlandais et les cours d’immersion" />
    <meta property="og:locale" content="fr_BE" />
    <meta property="og:image" content="https://ici-be.github.io/VF/social.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Woordjes : NL et FR dans deux bulles, et les cinq mascottes des matières" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
